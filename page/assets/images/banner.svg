<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap');
      .title {
        font-family: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
      }
      .mono {
        font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      .sans {
        font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
    </style>
    <clipPath id="b-spark-clip"><rect width="15.25" height="32"/></clipPath>
  </defs>
  <!-- Clean solid background (no gradient) -->
  <rect width="1200" height="420" rx="0" fill="#0c0d12" stroke="#1f212d" stroke-width="1.5"/>
  
  <!-- Subtle decorative grid dots -->
  <g fill="#ffffff" opacity="0.04">
    <circle cx="100" cy="60" r="1.5"/><circle cx="200" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/>
    <circle cx="900" cy="60" r="1.5"/><circle cx="1000" cy="60" r="1.5"/><circle cx="1100" cy="60" r="1.5"/>
    <circle cx="100" cy="360" r="1.5"/><circle cx="200" cy="360" r="1.5"/><circle cx="300" cy="360" r="1.5"/>
    <circle cx="900" cy="360" r="1.5"/><circle cx="1000" cy="360" r="1.5"/><circle cx="1100" cy="360" r="1.5"/>
  </g>

  <!-- Centered Logo Mark -->
  <g transform="translate(568, 64) scale(2)">
    <path d="M15.61 14.55L13.36 6.15M14.94 14.94L7.02 7.02M14.55 15.61L5.18 13.10M14.55 16.39L5.18 18.90M14.94 17.06L7.02 24.98M15.61 17.45L13.36 25.85"
          clip-path="url(#b-spark-clip)"
          fill="none"
          stroke="#6f86f0"
          stroke-width="2.6"
          stroke-linecap="round"/>
    <path d="M16.75 12.2L21 9.6C22 6.6 24.8 4.3 29 2.6C27.9 6.2 27.4 8.8 26.6 11.4C27 14.6 26.6 17.6 24.8 20.4L16.75 29Z M18.5 17.6L24.6 14.1L23.9 17.5Z"
          fill="#a7b7ff"
          fill-rule="evenodd"/>
  </g>

  <!-- Typography -->
  <text class="title" x="600" y="195" text-anchor="middle" font-family="'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="-1px" fill="#ffffff">DANAV</text>
  <text class="mono" x="600" y="238" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" letter-spacing="3px" text-transform="uppercase" fill="#6f86f0">ONE BRAIN · EVERY MODEL</text>
  <text class="sans" x="600" y="285" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa">Superintelligence that belongs to you</text>
  
  <!-- Badges (no borders, rounded-xs rx=2, no gradient, clean flat fill) -->
  <g transform="translate(385, 325)">
    <rect x="0" y="0" width="120" height="28" rx="0" fill="#1a1b26" stroke="none"/>
    <text class="mono" x="60" y="18" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#a7b7ff">100% RUST CORE</text>
    
    <rect x="130" y="0" width="154" height="28" rx="0" fill="#1a1b26" stroke="none"/>
    <text class="mono" x="207" y="18" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#a7b7ff">SUB-50MS SYSTEM ONE</text>
    
    <rect x="294" y="0" width="136" height="28" rx="0" fill="#1a1b26" stroke="none"/>
    <text class="mono" x="362" y="18" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#a7b7ff">TAURI V2 APP</text>
